name: Verify AquaPhi
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the exact simulation shipped in index.html
        run: npm test
